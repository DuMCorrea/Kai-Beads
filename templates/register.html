<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre-se</title>
    <style>
        body {
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .close-icon {
            position: absolute;
            top: 40px;
            right: 60px;
            font-size: 24px;
            color: #333;
            text-decoration: none;
            cursor: pointer;
        }
        .container {
            text-align: center;
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 320px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            color: #777;
        }
        a {
            color: #FF8A65;
            text-decoration: none;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }
        .google-btn {
            background-color: #fff;
            border: 1px solid #ccc;
            color: #000;
        }
        .facebook-btn {
            background-color: #1877f2;
            color: #fff;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }
        .divider span {
            flex: 1;
            height: 1px;
            background-color: #ccc;
        }
        .divider p {
            margin: 0 10px;
            color: #777;
        }
        .email-btn {
            background-color: #fff;
            border: 1px solid #ccc;
        }
        .email-form {
            display: none;
            margin-top: 15px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .register-btn {
            background-color: #FF8A65;
            color: white;
            font-weight: bold;
            cursor: not-allowed;
            opacity: 0.5;
        }
        .register-btn.active {
            cursor: pointer;
            opacity: 1;
        }
    </style>
</head>
<body>
    <a href="/index.html" class="close-icon">✖</a>
    <div class="container">
        <h1>Registre-se</h1>
        <p>Já é membro? <a href="login.html">Login</a></p>
        <button class="google-btn">Registrar-se com Google</button>
        <button class="facebook-btn">Registrar-se com Facebook</button>
        <div class="divider">
            <span></span>
            <p>ou</p>
            <span></span>
        </div>
        <button class="email-btn">Registrar-se com email</button>
        <div class="email-form">
            <input type="email" id="email" placeholder="Digite seu email">
            <input type="password" id="password" placeholder="Digite sua senha">
            <button class="register-btn" disabled>Registre-se</button>
        </div>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const firebaseConfig = {
                apiKey: "AIzaSyA5u3vlPtjofjBgsaT9z1qu2fifBhkKPmo",
                authDomain: "kaibeads-2ab98.firebaseapp.com",
                projectId: "kaibeads-2ab98",
                storageBucket: "kaibeads-2ab98.appspot.com",
                messagingSenderId: "405735155633",
                appId: "1:405735155633:web:a9c151f7d4b611b788ff90",
                measurementId: "G-N2NDBL58J7"
            };
            firebase.initializeApp(firebaseConfig);

            // Elementos
            const emailBtn = document.querySelector('.email-btn');
            const emailForm = document.querySelector('.email-form');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const registerBtn = document.querySelector('.register-btn');
            const googleBtn = document.querySelector('.google-btn');
            const facebookBtn = document.querySelector('.facebook-btn');

            emailBtn.addEventListener('click', () => {
                emailForm.style.display = 'block';
            });

            // --------- FUNÇÃO PARA CHECAR SEQUÊNCIA DE NÚMEROS ----------
            function hasNumericSequence(password, seqLength = 3) {
                for (let i = 0; i <= password.length - seqLength; i++) {
                    let isSeqAsc = true;
                    let isSeqDesc = true;
                    for (let j = 0; j < seqLength - 1; j++) {
                        let current = password.charCodeAt(i + j);
                        let next = password.charCodeAt(i + j + 1);
                        if (!(current >= 48 && current <= 57 && next >= 48 && next <= 57)) {
                            isSeqAsc = false;
                            isSeqDesc = false;
                            break;
                        }
                        if (next !== current + 1) isSeqAsc = false;
                        if (next !== current - 1) isSeqDesc = false;
                    }
                    if (isSeqAsc || isSeqDesc) return true;
                }
                return false;
            }

            // --------- FUNÇÃO PARA VALIDAR SENHA ---------
            function validatePassword(password) {
                if (password.length < 7) {
                    return "A senha deve ter pelo menos 7 caracteres.";
                }
                if (!/[a-z]/.test(password)) {
                    return "A senha deve conter pelo menos 1 letra minúscula.";
                }
                if (!/[A-Z]/.test(password)) {
                    return "A senha deve conter pelo menos 1 letra maiúscula.";
                }
                if (!/[0-9]/.test(password)) {
                    return "A senha deve conter pelo menos 1 número.";
                }
                if (hasNumericSequence(password, 3)) {
                    return "A senha não pode conter sequência de números.";
                }
                return "";
            }

            function validateForm() {
                const emailValid = emailInput.value.includes("@") && emailInput.value.includes(".");
                const password = passwordInput.value;
                const passwordError = validatePassword(password);

                registerBtn.disabled = !(emailValid && !passwordError);
                registerBtn.classList.toggle("active", emailValid && !passwordError);

                let alertElement = document.getElementById("password-alert");
                if (!alertElement) {
                    alertElement = document.createElement("div");
                    alertElement.id = "password-alert";
                    alertElement.style.color = "red";
                    alertElement.style.fontSize = "0.95rem";
                    alertElement.style.marginTop = "4px";
                    passwordInput.insertAdjacentElement("afterend", alertElement);
                }
                alertElement.textContent = passwordError;
            }

            emailInput.addEventListener('input', validateForm);
            passwordInput.addEventListener('input', validateForm);

            registerBtn.addEventListener('click', () => {
                const email = emailInput.value;
                const password = passwordInput.value;

                // Recheca para garantir
                const passwordError = validatePassword(password);
                if (passwordError) {
                    alert(passwordError);
                    return;
                }

                firebase.auth().fetchSignInMethodsForEmail(email)
                    .then((signInMethods) => {
                        if (signInMethods.length > 0) {
                            alert("Este email já está cadastrado! Redirecionando para o login.");
                            window.location.href = "login.html";
                        } else {
                            return firebase.auth().createUserWithEmailAndPassword(email, password)
                                .then(() => {
                                    alert("Cadastro realizado com sucesso!");
                                    window.location.href = "/index.html";
                                });
                        }
                    })
                    .catch((error) => {
                        alert(error.message);
                    });
            });

            googleBtn.addEventListener('click', () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                firebase.auth().signInWithPopup(provider)
                    .then(() => {
                        alert("Login com Google realizado com sucesso!");
                        window.location.href = "/index.html";
                    })
                    .catch((error) => {
                        alert(error.message);
                    });
            });

            facebookBtn.addEventListener('click', () => {
                const facebookProvider = new firebase.auth.FacebookAuthProvider();
                firebase.auth().signInWithPopup(facebookProvider)
                    .then(() => {
                        alert("Login com Facebook realizado com sucesso!");
                        window.location.href = "/index.html";
                    })
                    .catch((error) => {
                        alert(error.message);
                    });
            });
        });
    </script>
</body>
</html>
