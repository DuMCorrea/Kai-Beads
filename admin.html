<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Administração</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; }
        label { display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; }
        button { margin-top: 15px; padding: 10px; width: 100%; background-color: black; color: white; border: none; cursor: pointer; }
        .lista-produtos { margin-top: 40px; }
        .item-produto { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
        .item-produto button { background-color: red; margin-top: 10px; width: 100%; }
    </style>
</head>
<body>
    <h1>Painel de Administração</h1>

    <form id="form-adicionar-produto">
    <label for="sessao">Selecione a Sessão:</label>
    <select id="sessao" required>
        <option value="aneis">Anéis</option>
        <option value="brincos">Brincos</option>
        <option value="colares">Colares</option>
        <option value="correntes">Correntes</option>
        <option value="pulseiras">Pulseiras</option>
        <option value="piercings">Piercings</option>
        <option value="limpeza">Limpeza</option>
        <option value="canga-toalhas">Canga-toalhas</option>
        <option value="moletons">Moletons</option>
    </select>

    <label for="nome">Nome do Produto:</label>
    <input type="text" id="nome" required>

    <label for="preco">Preço (use ponto para decimais):</label>
    <input type="number" id="preco" step="0.01" required>

    <label for="imagem">Caminho da Imagem:</label>
    <input type="text" id="imagem" required placeholder="./assets/FotoAneis.png">

    <label for="observacao">Observação do Produto:</label>
<textarea id="observacao" rows="3" placeholder="Digite uma observação opcional..."></textarea>

<label for="especificacao">Especificações (um item por linha):</label>
<textarea id="especificacao" rows="4" placeholder="Ex: Material: Aço inoxidável&#10;Tamanho: Ajustável"></textarea>


    <!-- ✅ Checkbox de destaque (favorito) -->
    <label>
        <input type="checkbox" id="favorito" />
        Marcar como destaque
    </label>

    <button type="submit">Adicionar Produto</button>
</form>


    <div class="lista-produtos" id="lista-produtos">
        <h2>Produtos cadastrados</h2>
        
        <!-- Produtos aparecerão aqui -->
    </div>

    <script>
        const form = document.getElementById("form-adicionar-produto");
        const listaProdutos = document.getElementById("lista-produtos");
        const sessaoSelect = document.getElementById("sessao");

        function getKey(sessao) {
            return `produtos-${sessao}`;
        }

        function exibirProdutos() {
            const sessao = sessaoSelect.value;
            const key = getKey(sessao);
            listaProdutos.innerHTML = `<h2>Produtos cadastrados – ${sessao.charAt(0).toUpperCase() + sessao.slice(1)}</h2>`;

            const produtos = JSON.parse(localStorage.getItem(key)) || [];

            if (produtos.length === 0) {
                listaProdutos.innerHTML += "<p>Nenhum produto cadastrado.</p>";
                return;
            }

            produtos.forEach((produto, index) => {
                const div = document.createElement("div");
                div.className = "item-produto";
                div.innerHTML = `
    <strong>${produto.nome}</strong><br>
    Preço: R$ ${parseFloat(produto.preco).toFixed(2).replace('.', ',')}<br>
    Imagem: <em>${produto.imagem}</em><br>
    <label>
        <input type="checkbox" onchange="marcarDestaque('${sessao}', ${index}, this.checked)" ${produto.favorito ? "checked" : ""}>
        Marcar como destaque
    </label>
    <button onclick="removerProduto('${sessao}', ${index})">Remover</button>
`;

                listaProdutos.appendChild(div);
            });
        }

        function removerProduto(sessao, index) {
            const key = getKey(sessao);
            let produtos = JSON.parse(localStorage.getItem(key)) || [];
            produtos.splice(index, 1);
            localStorage.setItem(key, JSON.stringify(produtos));
            exibirProdutos();
        }

        function marcarDestaque(sessao, index, isFavorito) {
    const key = getKey(sessao);
    let produtos = JSON.parse(localStorage.getItem(key)) || [];
    produtos[index].favorito = isFavorito;
    localStorage.setItem(key, JSON.stringify(produtos));
    exibirProdutos();
}


        form.addEventListener("submit", (e) => {
            e.preventDefault();

            const sessao = sessaoSelect.value;
            const key = getKey(sessao);
            const nome = document.getElementById("nome").value;
            const preco = parseFloat(document.getElementById("preco").value).toFixed(2);
            const imagem = document.getElementById("imagem").value;
            const observacao = document.getElementById("observacao").value;
            const especificacao = document.getElementById("especificacao").value;
           

            const novoProduto = { nome, preco, imagem, observacao, especificacao, favorito: false };

            let produtos = JSON.parse(localStorage.getItem(key)) || [];
            produtos.push(novoProduto);
            localStorage.setItem(key, JSON.stringify(produtos));

            alert(`Produto adicionado na sessão "${sessao}" com sucesso!`);
            form.reset();
            exibirProdutos();
        });

        sessaoSelect.addEventListener("change", exibirProdutos);

        // Mostrar produtos da sessão selecionada ao carregar
        window.onload = exibirProdutos;
    </script>
</body>
</html>
